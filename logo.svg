<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Trove">
  <title>Trove</title>
  <style>
    .sprout { transform-origin: 32px 37px; animation: sway 6s ease-in-out infinite; }
    .leaf-l { transform-origin: 32px 27px; animation: breathe 6s ease-in-out infinite; }
    .leaf-r { transform-origin: 32px 23px; animation: breathe 6s ease-in-out -3s infinite; }
    .bud { transform-origin: 32px 13px; animation: pulse 3s ease-in-out infinite; }
    .halo { transform-origin: 32px 13px; opacity: 0; animation: glow 3s ease-in-out infinite; }
    .mote { opacity: 0; animation: rise 4.5s ease-out infinite; }
    .mote.b { animation-delay: -1.5s; }
    .mote.c { animation-delay: -3s; }
    @keyframes sway { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-2.5deg); } 75% { transform: rotate(2.5deg); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes glow { 0%, 100% { opacity: 0; transform: scale(.7); } 50% { opacity: .3; transform: scale(1); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(0); } 25% { opacity: .9; } 100% { opacity: 0; transform: translateY(-7px); } }
    @media (prefers-reduced-motion: reduce) {
      .sprout, .leaf-l, .leaf-r, .bud, .halo, .mote { animation: none; }
    }
  </style>

  <!-- pot -->
  <path d="M17 43h30l-3 15a2.5 2.5 0 0 1-2.45 2H22.45A2.5 2.5 0 0 1 20 58z" fill="#c0613a"/>
  <path d="M17 43h30l-.45 2.3H17.45z" fill="#9e4c2c" opacity=".55"/>
  <rect x="14" y="36" width="36" height="7" rx="3" fill="#d2724a"/>
  <rect x="17" y="37.7" width="10" height="1.6" rx=".8" fill="#fff" opacity=".28"/>

  <!-- sprout -->
  <g class="sprout">
    <path d="M32 37c0-8-1-14 0-21" fill="none" stroke="#2f6f6a" stroke-width="3.2" stroke-linecap="round"/>
    <g class="leaf-l">
      <path d="M32 27c-6-.5-11.5-4-13.5-9.5 6-1 12 2 13.5 9.5z" fill="#5b9c6a"/>
      <path d="M31 26c-4-1.8-7.5-4.3-9.8-7.2" fill="none" stroke="#467e55" stroke-width=".9" stroke-linecap="round" opacity=".7"/>
    </g>
    <g class="leaf-r">
      <path d="M32 23c5.5-.5 11-4 13-9.5-6-1-11.5 2-13 9.5z" fill="#7cb98a"/>
      <path d="M33 22c4-1.8 7.3-4.3 9.6-7.2" fill="none" stroke="#5f9d6e" stroke-width=".9" stroke-linecap="round" opacity=".7"/>
    </g>
    <circle class="halo" cx="32" cy="13" r="7.5" fill="#e8553a"/>
    <g class="bud">
      <circle cx="32" cy="13" r="4.4" fill="#d83a22"/>
      <circle cx="30.5" cy="11.5" r="1.4" fill="#fff" opacity=".45"/>
    </g>
  </g>

  <!-- rising motes -->
  <circle class="mote" cx="24.5" cy="11" r="1" fill="#e9a23b"/>
  <circle class="mote b" cx="40" cy="8.5" r=".9" fill="#e9a23b"/>
  <circle class="mote c" cx="35.5" cy="5" r=".7" fill="#e9a23b"/>
</svg>
