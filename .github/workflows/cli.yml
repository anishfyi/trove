name: cli

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -p trove-tools -p trove-retrieve -p trove-cli --check
      - name: Clippy
        run: cargo clippy --no-deps -p trove-tools -p trove-retrieve -p trove-cli --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Smoke test
        run: |
          trove=./target/debug/trove
          $trove index
          $trove ask "how does the retrieval budget work" --no-tools
          $trove ask --json "tool discovery" --budget 300 > /dev/null
          $trove tools search git
          $trove tools ls
