[package]
name = "trove-cli"
description = "CLI for Trove repository memory engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "trove"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["env"] }
serde.workspace = true
serde_json.workspace = true
trove-core = { path = "../trove-core" }
trove-index = { path = "../trove-index" }
trove-retrieve = { path = "../trove-retrieve" }
trove-tools = { path = "../trove-tools" }
trove-ship = { path = "../trove-ship" }
